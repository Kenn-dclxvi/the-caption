<!DOCTYPE html>
<html lang="ja">
<body style="margin:0; padding:0; background-color:#ffffff; font-family:-apple-system,BlinkMacSystemFont,sans-serif; -webkit-font-smoothing:antialiased;">
  <div style="max-width:440px; margin:auto; padding:45px 24px;">

    $safe_ratio_section

    <div style="margin-bottom:60px;">
      <div style="font-size:11px; font-weight:300; line-height:1.4; color:$c_slate; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:10px;">V4 Monthly Chronicle / $year_month</div>
      <div style="font-size:24px; font-weight:300; line-height:1.4; color:$c_ink; letter-spacing:0.1em; font-feature-settings:'palt';">$title</div>
    </div>

    <div style="margin-bottom:60px;">
      <div style="font-size:11px; font-weight:300; line-height:1.4; color:$c_slate; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:16px;">Monthly Conclusion</div>
      <div style="font-size:15px; font-weight:300; line-height:2.0; color:$c_ink; letter-spacing:0.1em;">$overview</div>
      <div style="font-size:13px; font-weight:300; line-height:1.8; color:$c_slate; letter-spacing:0.05em; margin-top:16px;">$market_causality</div>
    </div>

    <div style="margin-bottom:60px;">
      <div style="font-size:11px; font-weight:300; line-height:1.4; color:$c_slate; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:24px;">Portfolio Impact</div>
      <div style="border-left:1px solid $c_silver; padding-left:20px; margin-left:2px;">
        <div style="margin-bottom:32px;">$portfolio_impact</div>
        $trend_rows
      </div>
    </div>

    <div style="margin-bottom:60px; border-top:1px solid $c_silver; padding-top:24px;">
      <div style="font-size:11px; font-weight:300; line-height:1.4; color:$c_slate; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:16px;">Policy &amp; Watch</div>
      <div style="font-size:13px; font-weight:300; line-height:1.8; color:$c_ink; letter-spacing:0.05em;">$portfolio_audit</div>
      <div style="margin-top:20px;">$next_month_watch</div>
    </div>

    <div style="margin-top:60px; border-top:1px solid #f8fafc; padding-top:24px;">
      <p style="margin:0; font-size:9px; color:$c_silver; letter-spacing:0.1em; text-transform:uppercase;">$app_context</p>
    </div>
  </div>
</body>
</html>
