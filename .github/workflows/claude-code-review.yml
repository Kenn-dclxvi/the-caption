name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  claude-review:
    # draft PR ではレビューしない。ready_for_review で走る。
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # レビュー結果をPRコメントとして投稿するため write が必要。
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # レビュー観点は .claude/commands/pr-review.md を正本とする。
          # ローカルでも同じ `/pr-review <PR番号>` で実行できる。
          prompt: '/pr-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # 投稿手段を許可しないとレビュー本文がPRへ届かず、job成功のまま出力0件になる。
          claude_args: '--allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*),Bash(gh pr comment:*),Read,Grep,Glob"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
