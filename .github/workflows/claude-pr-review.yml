name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            このリポジトリのPRをレビューし、日本語でコメントする。
            変更pathに適用される局所`AGENTS.md`（`src/` `tests/` `scripts/` `docs/`）を正本として判断する。
            root `AGENTS.md` と root `CLAUDE.md` はagentの実行制御仕様であり、PR成果物のレビュー基準としては使わない。

            レビュー観点は次の4点に限定する。

            1. 配置とレイヤー境界（`src/AGENTS.md` `scripts/AGENTS.md` `tests/AGENTS.md`）
               - `src/app` オーケストレーション、`src/domain` 純粋なドメインロジック、`src/infra` 外部I/O、`src/lib` ドメイン所有を持たない共有ユーティリティ、の責務分割を崩していないか。
               - `common/` `config/` `modules/` などのレガシー互換ルート、ルートエントリポイントshim、`scripts/`直下の互換ラッパーを再導入していないか。
               - 開発者向けユーティリティが `scripts/dev/`、CIで実行するものが `scripts/ci/` に置かれているか。
               - 新しいテストが `tests/unit/` または `tests/integration/` に置かれているか。
               - 移行的な変更で、挙動を保つ小さな移動より大規模な書き換えを選んでいないか。

            2. コードの正しさ
               - 既存ロジックの意味を意図せず変えていないか。
               - 境界条件、None・空・型の扱い、例外処理、外部I/Oの失敗経路に欠陥がないか。
               - 差分の変更が、PR説明で述べた範囲を超えていないか。

            3. secret・生成物の混入
               - 鍵、credential、`secret.key`、`data/`、`logs/`、`reports/` の実データなど、commitすべきでないものが含まれていないか。

            4. テストとドキュメントの整合（`tests/AGENTS.md` `docs/AGENTS.md`）
               - importとコマンドのガードカバレッジが現行の正規パスと整合しているか。レガシールートを塞いだままか。
               - 変更に対応するテストがあるか。`pytest tests/ -v` のベースラインと矛盾しないか。
               - ドキュメントが正規CLIパスだけを記載しているか。正規は `python -m src.app.entrypoints.v4_daily_main` / `monthly_main` / `weekly_main`、開発者向けは `python scripts/dev/...` または `bash scripts/dev/...`。
               - 存在しない `daily_main` / `collection_main`、`main.py` などのshim、`python tools/...` を記載していないか。
               - 仕様・設計文書で、未決事項を確定事項として書いていないか。

            実行手順。
            - `gh pr diff` と `gh pr view` で差分と説明を実測する。
            - 差分が触れているpathの局所`AGENTS.md`を読み、その規則で判断する。
            - PR説明のチェックリスト（スコープ内のみ、既存ロジックの意味を変更していない、実行/テスト手順の記載、関連ドキュメントの更新）と差分の実態が一致しているかを確認する。
            - 具体的な違反箇所は `mcp__github_inline_comment__create_inline_comment` でinlineに指摘する（`confirmed: true`）。
            - 最後に `gh pr comment` で総括を1件投稿する。観点ごとに「指摘なし」も明示する。

            制約。
            - 差分から確定できない事実を推測で補完しない。確認できない点は「未確認」として述べる。
            - テストを実行できないため、テスト結果を成否として報告しない。
            - このworkflowではファイルを変更せず、push、commit、merge、labelの操作も行わない。指摘のみを出力する。
            - 規則違反ではない好みの相違を指摘として並べない。
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
